name: build

# Every push to main builds the Windows and macOS installers as workflow
# artifacts; a v* tag also drafts a GitHub release with them attached.
# Signing: unsigned until the certificates exist (see README).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            targets: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Grupr Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Installers for Windows (.exe, .msi) and macOS (.dmg). Unsigned for now: Windows SmartScreen and macOS Gatekeeper will ask you to confirm.'
          releaseDraft: true
          prerelease: false
      - uses: actions/upload-artifact@v4
        with:
          name: grupr-desktop-${{ matrix.os }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: ignore
